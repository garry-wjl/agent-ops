server {
    listen       80;
    server_name  _;
    # 官方 nginx 镜像默认站点根目录
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA history fallback：刷新深链接也能命中 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* 反代到 BE
    # NOTE: rd-agent-be 是 K8s Service 名的假设值，部署后如不通需运维确认实际 service
    location /api/ {
        proxy_pass http://rd-agent-be:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 哈希文件名的静态资源长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 永不缓存（保证用户拿到最新版本入口）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
