# 前端静态资源部署配置（替代原 Apollo OSS_CONFIG / S3_CONFIG）
# 支持 ${ENV_VAR} 与 ${ENV_VAR:default} 占位；CI 通过环境变量注入真实密钥。
#
# 圈外（develop / test / prod）：填 OSS_CONFIG
# 圈内（sws-stag / sws-prod）：填 S3_CONFIG

OSS_CONFIG:
  OSS_KEY: ${OSS_KEY:}
  OSS_SECRET: ${OSS_SECRET:}
  OSS_BUCKET: ${OSS_BUCKET:}
  OSS_REGION: ${OSS_REGION:}
  OSS_UPLOAD_PATH: ${OSS_UPLOAD_PATH:}
  OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:}

S3_CONFIG:
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:}
  S3_SECRET_KEY: ${S3_SECRET_KEY:}
  S3_BUCKET: ${S3_BUCKET:}
  S3_ENDPOINT: ${S3_ENDPOINT:}
