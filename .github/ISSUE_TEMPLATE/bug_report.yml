name: Bug report
description: 报告可复现的缺陷
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请搜索是否已有相同 Issue。
        **安全漏洞请走 Security Advisories，不要用本模板。**
  - type: dropdown
    id: component
    attributes:
      label: 组件
      description: 问题主要落在哪一侧
      options:
        - agent-be
        - agent-fe
        - both / integration
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 一句话描述缺陷
      placeholder: 例如：调试台 SSE invoke 后 MCP 工具注册失败被跳过
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量最小化、可复现
      placeholder: |
        1. 启动 agent-be / agent-fe …
        2. 打开调试台 …
        3. 发送 …
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可附关键日志片段（请打码密钥 / Cookie / Token）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 分支名、tag 或完整 commit SHA
      placeholder: main @ abcdef0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: OS、JDK、Node/pnpm、MySQL/Redis、浏览器等
      placeholder: |
        - OS: macOS 15
        - JDK: 17
        - Node: 20 / pnpm 9
        - Browser: Chrome …
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，未发现重复
          required: true
        - label: 本报告不包含未披露的安全漏洞细节
          required: true
